@if(visible){
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
    @if(style == 'danger'){
    <div class="w-[600px] bg-white shadow-2xl animate-[fadeIn_0.2s_ease] relative p-6">
        <i-lucide [img]="x" [strokeWidth]="1" (click)="onCancel()"
            class="text-gray-700 w-12 h-12 pt-2 pe-3 cursor-pointer hover:text-black absolute top-0 right-0"></i-lucide>
        <div
            class="m-auto my-5 flex justify-center items-center bg-red-100 w-25 h-25 rounded-full border-10 border-red-50 ">
            <i-lucide [img]="content.icon" [strokeWidth]="1" class="w-10 h-10 text-red-500"></i-lucide>
        </div>
        <h2 class="text-center text-xl font-semibold text-red-500">
            {{content.header}}
        </h2>
        <p class="text-center text-sm text-gray-500 mt-2">
            {{content.body}}
        </p>
        <div class="mt-6 flex justify-between gap-3 bg-gray-100 border-t border-gray-200 p-4">
            <button (click)="onCancel()"
                class="w-full bg-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-400 hover:text-white transition cursor-pointer">
                Cancel
            </button>
            <button (click)="onConfirm()"
                class="w-full bg-red-500 px-4 py-3 text-sm font-medium text-white hover:bg-red-600 transition cursor-pointer">
                Confirm
            </button>

        </div>

    </div>
    }@else if(style == 'primary'){
    <div class="w-[600px] bg-white shadow-2xl animate-[fadeIn_0.2s_ease] relative p-6">
        <i-lucide [img]="x" [strokeWidth]="1" (click)="onCancel()"
            class="text-gray-700 w-12 h-12 pt-2 pe-3 cursor-pointer hover:text-black absolute top-0 right-0"></i-lucide>
        <div
            class="m-auto my-5 flex justify-center items-center bg-blue-100 w-25 h-25 rounded-full border-10 border-blue-50 ">
            <i-lucide [img]="content.icon" [strokeWidth]="1" class="w-10 h-10 "></i-lucide>
        </div>
        <h2 class="text-center text-xl font-semibold text-blue-600">
            {{content.header}}
        </h2>
        <p class="text-center text-sm text-gray-500 mt-2">
            {{content.body}}
        </p>
        <div class="mt-6 flex justify-between gap-3 bg-gray-100 border-t border-gray-200 p-4">
            <button (click)="onCancel()"
                class="w-full bg-gray-200 py-3 text-sm font-medium text-gray-700 hover:bg-gray-400 hover:text-white transition cursor-pointer">
                Cancel
            </button>
            <button (click)="onConfirm()"
                class="w-full bg-blue-600 py-3 text-sm font-medium text-white hover:bg-blue-800 transition cursor-pointer">
                Confirm
            </button>

        </div>

    </div>
    }
