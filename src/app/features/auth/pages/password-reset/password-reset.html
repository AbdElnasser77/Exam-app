<div class="h-screen max-w-lg mx-auto flex flex-col justify-center">
    <h1 class="text-3xl font-bold pb-2">Create a New Password</h1>
    <p class="text-gray-500 pb-6">Create a new strong password for your account.</p>

    <form [formGroup]="resetForm">
        <div class="mb-2 w-full">
            <label class="block mb-1 font-medium">New Password<span class="text-red-500">*</span></label>
            <p-password formControlName="newPassword" [placeholder]="'********'" class="w-full" [feedback]="false"
                [toggleMask]="true" />
            <validation-error [control]="newPasswordControl" InputLabel="new password"></validation-error>
        </div>

        <div class="mb-7 w-full">
            <label class="block mb-1 font-medium">Confirm New Password<span class="text-red-500">*</span></label>
            <p-password formControlName="confirmPassword" [placeholder]="'********'" class="w-full" [feedback]="false"
                [toggleMask]="true" />
            <validation-error [control]="confirmPasswordControl" InputLabel="confirm password"></validation-error>
        </div>

        <div [class.hidden]="!errorMessage"
            class="hidden bg-red-600/10 py-3 text-center border border-red-600 mb-4 mt-2 relative">
            <i-lucide [img]="circleX" [size]="20"
                class="text-red-600 absolute top-3 left-3 bg-white rounded-full"></i-lucide>
            <p class="text-red-600 text-sm pt-1">{{ errorMessage }}</p>
        </div>

        <buttonComponent (click)="resetPassword()">Reset Password</buttonComponent>

        <div class="my-5 text-center">
            <p class="ms-2 text-sm font-medium text-gray-600 text-heading select-none">
                Don't have an account?
                <a routerLink="/auth/register"
                    class="text-blue-700 text-fg-brand hover:text-blue-900 transition">Create yours</a>
            </p>
        </div>
    </form>
</div>
