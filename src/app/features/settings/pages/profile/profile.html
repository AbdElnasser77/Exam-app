<app-modal [visible]="modalState.visible && modalState.type === 'OTP'" [type]="'OTP'" (cancel)="closeModal()"
    (confirm)="onConfirm()"></app-modal>
<app-modal [visible]="modalState.visible && modalState.type === 'Delete'" [style]="'danger'" [content]="content"
    [confirmButton]="'Yes, delete'" (cancel)="closeModal()" (confirm)="onConfirm()"></app-modal>
  <p-toast key="br" position="bottom-right" styleClass="my-toast" />
<form [formGroup]="profileSettings">

    <div class="flex gap-4 mb-4">
        <div class="w-full">
            <label for="firstName" class="block mb-1 font-medium">First Name</label>
            <input formControlName="firstName" type="text" id="firstName" class="custom-input w-full"
                placeholder="First Name" pInputText />

            <validation-error [control]="profileSettings.get('firstName')" [InputLabel]="'First Name'"></validation-error>
        </div>
        <div class="w-full">
            <label for="lastName" class="block mb-1 font-medium">Last Name</label>
            <input formControlName="lastName" type="text" id="lastName" class="custom-input w-full"
                placeholder="Last Name" pInputText />

            <validation-error [control]="profileSettings.get('lastName')" [InputLabel]="'Last Name'"></validation-error>
        </div>
    </div>

    <div class="w-full mb-4">
        <label for="userName" class="block mb-1 font-medium">Username</label>
        <input #userNameInput type="text" id="userName" formControlName="userName"
            class="disabled w-full" placeholder="Username" pInputText readonly />

    </div>

    <div class="mb-4">
        <div class="flex justify-between">
            <label for="email" class="block mb-1 font-medium">Email</label>
            <button type="button" (click)="openModal('OTP')"
                class="text-blue-600 hover:underline font-semibold cursor-pointer flex items-center gap-1"><i-lucide
                    [img]="Pencil" [size]="16"></i-lucide> Change</button>
        </div>
        <input type="email" formControlName="email" id="email" class="readonly border-gray-200 w-full"
            placeholder="user@example.com" pInputText required readonly />
    </div>

    <div>
        <label for="phone" class="block mb-1 font-medium">Phone</label>
        <ngx-intl-tel-input formControlName="phone" [cssClass]="'custom-input'"
            [preferredCountries]="[CountryISO.Egypt, CountryISO.UnitedStates, CountryISO.UnitedKingdom]"
            [enableAutoCountrySelect]="true" [enablePlaceholder]="true" [searchCountryFlag]="true"
            [searchCountryField]="[SearchCountryField.Iso2, SearchCountryField.Name]" [selectFirstCountry]="false"
            [selectedCountryISO]="CountryISO.Egypt" [separateDialCode]="true" [phoneValidation]="true"
            [numberFormat]="PhoneNumberFormat.National" [maxLength]="15">
        </ngx-intl-tel-input>
        <validation-error [control]="profileSettings.get('phone')" [InputLabel]="'Phone'"></validation-error>
    </div>


    <div class="flex gap-4 mt-5">
        <buttonComponent [preset]="'danger'" (click)="openModal('Delete')" [size]="'lg'" class="w-full"> Delete My
            Account</buttonComponent>
        <buttonComponent (click)="saveChanges()" [size]="'lg'" class="w-full"> Save Changes</buttonComponent>
    </div>

    @if (errorMessage) {
        <p class="text-red-500 text-sm mt-2">{{ errorMessage }}</p>
    }
    @if (errors.length > 0) {
        <div class="text-red-500 text-sm mt-2">
            @for (error of errors; track error) {
                <p>{{ error }}</p>
            }
        </div>
    }
</form>
