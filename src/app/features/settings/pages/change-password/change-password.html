<p-toast key="br" position="bottom-right" />

<form [formGroup]="changePasswordForm">

    <div class="w-full ">
        <label class="block mb-1 font-medium">Current Password<span class="text-red-500">*</span></label>
        <p-password formControlName="currentPassword" [placeholder]="'********'" class="w-full" [feedback]="false"
            [toggleMask]="true" />
        <validation-error [control]="changePasswordForm.get('currentPassword')" InputLabel="current password"></validation-error>
    </div>

    <div class="h-[1px] w-full bg-gray-200 my-5"></div>

    <div class="mb-2 w-full ">
        <label class="block mb-1 font-medium">New Password<span class="text-red-500">*</span></label>
        <p-password formControlName="newPassword" [placeholder]="'********'" class="w-full" [feedback]="false"
            [toggleMask]="true" />
        <validation-error [control]="changePasswordForm.get('newPassword')" InputLabel="new password"></validation-error>

    </div>
    <div class="mb-7 w-full ">
        <label class="block mb-1 font-medium">Confirm New Password<span class="text-red-500">*</span></label>
        <p-password formControlName="confirmPassword" [placeholder]="'********'" class="w-full" [feedback]="false"
            [toggleMask]="true" />
        <validation-error [control]="changePasswordForm.get('confirmPassword')" InputLabel="confirm password"></validation-error>
    </div>

    <div [class.hidden]="!errorMessage"
        class="hidden bg-red-600/10 py-3 text-center border border-red-600 mb-4 mt-2 relative">
        <i-lucide [img]="circleX" [size]="20" class="text-red-600 absolute top-3 left-3 bg-white rounded-full"></i-lucide>
        <p class="text-red-600 text-sm pt-1">{{ errorMessage }}</p>
    </div>

    <div class="pt-2 ">
        <buttonComponent (click)="changePassword()">Update Password
        </buttonComponent>
    </div>

</form>
