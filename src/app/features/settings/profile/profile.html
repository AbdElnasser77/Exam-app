    <app-modal [visible]="modalState.visible && modalState.type === 'OTP'" [type]="'OTP'" (cancel)="closeModal()" (confirm)="onConfirm()"></app-modal>
    <app-modal [visible]="modalState.visible && modalState.type === 'Delete'" [style]="'danger'" [content]="content" [confirmButton]="'Yes, delete'" (cancel)="closeModal()" (confirm)="onConfirm()"></app-modal>

    <form [formGroup]="profileSettings">

        <div class="flex gap-4 mb-4">
            <div class="w-full">
                <label for="firstName" class="block mb-1 font-medium">First Name</label>
                <input #firstNameInput formControlName="firstName" type="text" id="firstName"
                    class="custom-input w-full" placeholder="First Name" pInputText />

                <validation-error [InputLabel]="'firstName'"></validation-error>
            </div>
            <div class="w-full">
                <label for="lastName" class="block mb-1 font-medium">Last Name</label>
                <input #emailInput formControlName="lastName" type="text" id="lastName" class="custom-input w-full"
                    placeholder="Last Name" pInputText />

                <validation-error [InputLabel]="'firstName'"></validation-error>
            </div>
        </div>

        <div class="w-full mb-4">
            <label for="userName" class="block mb-1 font-medium">Username</label>
            <input #userName type="text" id="userName" class="custom-input w-full" placeholder="Username" pInputText
                [disabled]="true" readonly />
        </div>

        <div class="mb-4">
            <div class="flex justify-between">
                <label for="email" class="block mb-1 font-medium">Email</label>
                <button type="button" (click)="openModal('OTP')" class="text-blue-600 hover:underline font-semibold cursor-pointer flex items-center gap-1"><i-lucide  [img]="Pencil" [size]="16"></i-lucide> Change</button>
            </div>
            <input #emailInput type="email" id="email" class="custom-input w-full" placeholder="user@example.com"
                pInputText required readonly />

            <validation-error [InputLabel]="'email'"></validation-error>
        </div>

        <div>
            <label for="phone" class="block mb-1 font-medium">Phone</label>
            <ngx-intl-tel-input formControlName="phone" #phoneInput [cssClass]="'custom-input'"
                [preferredCountries]="[CountryISO.Egypt, CountryISO.UnitedStates, CountryISO.UnitedKingdom]"
                [enableAutoCountrySelect]="true" [enablePlaceholder]="true" [searchCountryFlag]="true"
                [searchCountryField]="[SearchCountryField.Iso2, SearchCountryField.Name]" [selectFirstCountry]="false"
                [selectedCountryISO]="CountryISO.Egypt" [separateDialCode]="true" [phoneValidation]="true"
                [numberFormat]="PhoneNumberFormat.National" [maxLength]="15">
            </ngx-intl-tel-input>
            <validation-error [InputLabel]="'phone'"></validation-error>
        </div>


        <div class="flex gap-4 mt-5">
            <buttonComponent [preset]="'danger'" (click)="openModal('Delete')" [size]="'lg'" class="w-full"> Delete My Account</buttonComponent>
            <buttonComponent [size]="'lg'" class="w-full"> Save Changes</buttonComponent>
        </div>
    </form>
